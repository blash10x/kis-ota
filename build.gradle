plugins {
	id 'java'
    id 'org.springframework.boot' version '3.5.11'
	id 'io.spring.dependency-management' version '1.1.7'
    id "com.google.osdetector" version "1.7.3" // OS detector plugin
}

group = 'blash10x.kis'
version = '0.0.1-SNAPSHOT'
description = 'KIS Open Trading API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

    implementation 'org.jsoup:jsoup:1.22.1'

    compileOnly 'org.projectlombok:lombok'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

    if (osdetector.os == 'osx') { // MacOS
        // Workaround: Unable to load io.netty.resolver.dns.macos.MacOSDnsServerAddressStreamProvider
        runtimeOnly("io.netty:netty-resolver-dns-native-macos:4.2.10.Final:osx-aarch_64")
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    systemProperty 'spring.profiles.active', 'test'

	useJUnitPlatform()
    jvmArgs "-Xshare:off"

    testLogging {
        events "FAILED"

        showStandardStreams = true
        showCauses = true
        showExceptions = true
        showStackTraces = true
        exceptionFormat = 'full'
    }
}
